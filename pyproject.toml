[project]
name = "typed-json"
version = "0.1.0"
description = "stdlib json.loads/dumps typed as a recursive JsonValue instead of Any"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lib/typed_json"]
exclude = ["**/*_test.py"]

[dependency-groups]
dev = [
  "black>=25.1.0",
  "copier>=9.4.1",
  "hypothesis>=6.139.1",
  "isort>=5.13.2",
  "pre-commit>=4.3.0",
  "pyright>=1.1.405",
  "pytest>=8.4.2",
  "pytest-pyright>=0.0.6",
  "pyupgrade>=3.19.0",
]

[tool.pytest.ini_options]
addopts = "--doctest-modules"
python_classes = ["Describe*", "When*", "Test*"]
python_functions = ["it_*", "test_*"]

[tool.pyright]
typeCheckingMode = "strict"
analyzeUnannotatedFunctions = true
reportIncompatibleMethodOverride = "error"
pythonVersion = "3.12"
enableTypeIgnoreComments = true
reportPrivateUsage = "warning"
reportConstantRedefinition = "error"
reportIncompatibleVariableOverride = "error"
reportMissingImports = "error"
reportMissingTypeStubs = false
exclude = [".venv", "__pycache__", "node_modules", "trash", "typesafety"]
